server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 10m;

    # Docker's embedded DNS, plus a variable in proxy_pass, forces nginx to
    # re-resolve "backend" on every request instead of caching its IP at
    # startup — otherwise a `docker compose up --build backend` (which gives
    # the container a new IP) leaves nginx stuck proxying to a dead address
    # until the frontend container itself is restarted.
    resolver 127.0.0.11 valid=10s;

    # Same-origin proxy to the backend so the built frontend never needs a
    # hardcoded LAN IP baked in — works identically over the LAN, a tunnel,
    # or any public hostname. Using a variable in proxy_pass (needed for the
    # resolver above) disables nginx's automatic /api/ prefix-stripping, so
    # the regex capture below rebuilds the path manually instead.
    location ~ ^/api/(.*)$ {
        set $backend_upstream http://backend:3001;
        proxy_pass $backend_upstream/$1$is_args$args;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # index.html debe revalidarse siempre (sin esto, un reload normal del
    # navegador puede seguir sirviendo un build viejo cacheado en disco tras
    # cada deploy, incluso con F5) - los assets hasheados (JS/CSS con hash en
    # el nombre, cambian en cada build) si se pueden cachear largo y fuerte.
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }
    location ~* \.(?:js|css|woff2?|png|jpg|jpeg|svg|webp|ico)$ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
